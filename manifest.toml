#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "plik"
name = "Plik"
description.en = "Temporary file upload system (Wetransfer like)"
description.fr = "Application de partage de fichiers temporaires"

version = "1.4.3~ynh1"

maintainers = ["otm33GH"]

[upstream]
license = "MIT"
demo = "https://plik.root.gg"
admindoc = "https://root-gg.github.io/plik"
userdoc = "https://root-gg.github.io/plik"
code = "https://github.com/root-gg/plik"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = ["amd64","arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/plik"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.admin]
    type = "string"
    ask.en = "Admin name"
    ask.fr = "Nom pour l'administrateur"
    help.en = "Choose the admin name for this app (min. 4 characters)"
    help.fr = "Choisissez un nom pour l'administrateur de cette application (min. 4 caractères)"

    [install.auth_mode]
    ask.en = "Enable authentication to share files ?"
    ask.fr = "Activer l'authentification pour le partage de fichiers ?"
    type = "select"
    choices = ["forced", "default"]
    default = "forced"
    help.en = "forced -> no anonymous upload / default -> anonymous and authenticated upload"
    help.fr = "forced -> pas de téléchargement anonyme / default -> téléchargement anonyme et authentifié possible"
    
[resources]
    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/root-gg/plik/releases/download/1.4.3/plik-server-1.4.3-linux-amd64.tar.gz"
    amd64.sha256 = "eb40503e31aca0711fb85d0026aa1d225d9d32f432e7e777c769372581fca354"

    arm64.url = "https://github.com/root-gg/plik/releases/download/1.4.3/plik-server-1.4.3-linux-arm64.tar.gz"
    arm64.sha256 = "1e7bfe5a03a9a921b1a3af9b8c4f73f39f3405b59186ae96041715975e54f061"

    armhf.url = "https://github.com/root-gg/plik/releases/download/1.4.3/plik-server-1.4.3-linux-arm.tar.gz"
    armhf.sha256 = "d6e69cf98ea318b055cecc9be26a1d50981cf684e1d2956477f779d3a7cf2aef"

    autoupdate.asset.amd64 = "plik-server-.*-linux-amd64.tar.gz"
    autoupdate.asset.arm64 = "plik-server-.*-linux-arm64.tar.gz"
    autoupdate.asset.armhf = "plik-server-.*-linux-arm.tar.gz"

    autoupdate.strategy = "latest_github_release"

    in_subdir = 1
    rename = "plik"

    [resources.system_user]
    
    [resources.install_dir]
 

    [resources.data_dir]
    subdirs = ["files"]

    [resources.permissions]
    main.url = "/"

    [resources.apt]
    packages = "postgresql libpq-dev"

    [resources.ports]

    [resources.database]
    type = "postgresql"
	